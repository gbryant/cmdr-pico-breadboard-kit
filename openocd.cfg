# SWD debug via a CMSIS-DAP probe (the RP2350 debug probe running debugprobe
# firmware, or a Pico running the same). Carried over from the original
# pico_breadboard_kit project, where this exact config drove this board.
#
# Wiring: probe SWCLK -> kit SWCLK, SWDIO -> SWDIO, GND -> GND. Power the kit
# separately over USB; the probe's 3V3 pin is not a supply for the whole board.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 5000

source [find target/rp2350.cfg]

# The RP2350's second core needs SYSRESETREQ rather than the default reset, or a
# `reset` with both cores running leaves core1 in a state gdb can't recover.
rp2350.dap.core1 cortex_m reset_config sysresetreq
